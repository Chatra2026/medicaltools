<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TNM分類 進展度早見ツール v0.4</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --warn: #fff7ed;
      --warn-line: #fed7aa;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    header {
      padding: 22px 16px 12px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.3;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 14px 30px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin: 14px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-three {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 0.92rem;
    }

    select, input {
      width: 100%;
      padding: 12px 11px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      font-size: 1rem;
    }

    select:focus, input:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }

    .hint-panel {
      margin-top: 8px;
      min-height: 54px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      padding: 10px;
      font-size: 0.9rem;
      color: #334155;
    }

    .hint-title {
      font-weight: 800;
      color: #475569;
      margin-bottom: 2px;
      font-size: 0.82rem;
    }

    .result-box {
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 14px;
      background: #f9fafb;
    }

    .result-title {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stage {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .stage.ok { color: #047857; }
    .stage.warn { color: #c2410c; }
    .stage.danger { color: #b91c1c; }
    .stage.neutral { color: #374151; }

    .logic {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--accent-soft);
      color: #1e40af;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .note {
      margin-top: 12px;
      background: var(--warn);
      border: 1px solid var(--warn-line);
      border-radius: 14px;
      padding: 12px;
      color: #7c2d12;
      font-size: 0.92rem;
    }

    details {
      margin-top: 12px;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
    }

    summary {
      cursor: pointer;
      font-weight: 900;
      color: #1d4ed8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.92rem;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 8px 6px;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    .small {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .footer {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      padding: 10px 0 20px;
    }

    @media (max-width: 720px) {
      .grid, .grid-three {
        grid-template-columns: 1fr;
      }
      h1 { font-size: 1.25rem; }
      .stage { font-size: 1.45rem; }
      .card { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TNM分類 進展度早見ツール v0.4</h1>
    <div class="subtitle">T/N/Mの横に定義コメントを表示するパイロット版</div>
  </header>

  <main>
    <section class="card">
      <div class="grid">
        <div>
          <label for="categorySelect">大分類</label>
          <select id="categorySelect"></select>
        </div>
        <div>
          <label for="siteSelect">部位・分類</label>
          <select id="siteSelect"></select>
        </div>
      </div>

      <div class="grid-three" style="margin-top: 14px;">
        <div>
          <label for="tSelect">T分類</label>
          <select id="tSelect"></select>
          <div class="hint-panel">
            <div class="hint-title">Tの説明</div>
            <div id="tDesc">-</div>
          </div>
        </div>
        <div>
          <label for="nSelect">N分類</label>
          <select id="nSelect"></select>
          <div class="hint-panel">
            <div class="hint-title">Nの説明</div>
            <div id="nDesc">-</div>
          </div>
        </div>
        <div>
          <label for="mSelect">M分類</label>
          <select id="mSelect"></select>
          <div class="hint-panel">
            <div class="hint-title">Mの説明</div>
            <div id="mDesc">-</div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="result-box">
        <div class="result-title">判定結果</div>
        <div id="stageResult" class="stage neutral">-</div>
        <div id="logicResult" class="logic"></div>
        <div class="badge-row" id="selectedBadges"></div>
      </div>

      <div class="note">
        このツールは院内登録・確認用の早見表パイロット版です。診断・治療方針決定には使用せず、必ず原資料と診療録で確認してください。
      </div>

      <details>
        <summary>この部位の登録ルールを見る</summary>
        <div id="ruleTable"></div>
      </details>
    </section>

    <section class="card">
      <label for="quickInput">TNMまとめ入力（試験機能）</label>
      <input id="quickInput" placeholder="例：T3N1M0 / T4a N0 M0 / pT2 pN0 cM0">
      <div class="small" style="margin-top: 6px;">
        入力すると、T/N/Mのプルダウンへ自動反映します。完全な自然文抽出はまだ未対応です。
      </div>
    </section>

    <div class="footer">
      出典：国立がん研究センター がん情報サービス「進展度，UICC TNM分類対応表（72部位，UICC第8版準拠）」をもとに作成中
    </div>
  </main>

        ],

          {code:"N1", desc:"領域リンパ節転移あり"},

        }

    ];

    const categorySelect = document.getElementById("categorySelect");
    const siteSelect = document.getElementById("siteSelect");
    const tSelect = document.getElementById("tSelect");
    const nSelect = document.getElementById("nSelect");
    const mSelect = document.getElementById("mSelect");
    const tDesc = document.getElementById("tDesc");
    const nDesc = document.getElementById("nDesc");
    const mDesc = document.getElementById("mDesc");
    const stageResult = document.getElementById("stageResult");
    const logicResult = document.getElementById("logicResult");
    const selectedBadges = document.getElementById("selectedBadges");
    const ruleTable = document.getElementById("ruleTable");
    const quickInput = document.getElementById("quickInput");

    function unique(items) {
      return [...new Set(items)];
    }

    function optionLabel(item) {
      return item.desc ? `${item.code}（${item.desc}）` : item.code;
    }

    function makeOptions(select, items, includeEmpty = false) {
      select.innerHTML = "";
      if (includeEmpty) {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "選択してください";
        select.appendChild(opt);
      }
      items.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.code;
        opt.textContent = optionLabel(item);
        select.appendChild(opt);
      });
    }

    function getCurrentSite() {
      return DATA.find(row => row.category === categorySelect.value && row.site === siteSelect.value);
    }

    function findItem(items, code) {
      return items.find(item => item.code === code);
    }

    function initCategories() {
      const categories = unique(DATA.map(row => row.category));
      makeOptions(categorySelect, categories.map(code => ({code, desc:""})));
      updateSites();
    }

    function updateSites() {
      const sites = DATA
        .filter(row => row.category === categorySelect.value)
        .map(row => ({code: row.site, desc: ""}));
      makeOptions(siteSelect, sites);
      updateTnmOptions();
    }

    function updateTnmOptions() {
      const site = getCurrentSite();
      if (!site) return;

      makeOptions(tSelect, site.t, true);
      makeOptions(nSelect, site.n, true);
      makeOptions(mSelect, site.m, true);

      const defaultT = site.t.find(x => x.code === "T1") || site.t.find(x => x.code === "T1a") || site.t[0];
      if (defaultT) tSelect.value = defaultT.code;
      if (site.n.some(x => x.code === "N0")) nSelect.value = "N0";
      if (site.m.some(x => x.code === "M0")) mSelect.value = "M0";

      updateResult();
      renderRuleTable();
    }

    function isUnknown(value) {
      return !value || value === "Tx" || value === "Nx" || value === "Mx";
    }

    function judge(site, t, n, m) {
      if (!site) return { stage: "-", tone: "neutral", reason: "部位を選択してください。" };

      const r = site.rules;

      if (r.distant.includes(m)) {
        return { stage: "遠隔転移", tone: "danger", reason: `${m} が選択されているため、遠隔転移を優先して判定します。` };
      }

      if (isUnknown(t) || isUnknown(n) || isUnknown(m)) {
        return { stage: "判定保留", tone: "warn", reason: "Tx / Nx / Mx / 未選択が含まれるため、進展度は確定できません。" };
      }

      if (r.regionalNodes.includes(n)) {
        return { stage: "領域リンパ節転移", tone: "ok", reason: `${n} が領域リンパ節転移群に含まれるため、N分類を優先して判定します。` };
      }

      if (r.adjacent.includes(t)) {
        return { stage: "隣接臓器浸潤", tone: "ok", reason: `${t} が隣接臓器浸潤群に含まれ、${n}${m} のため、T分類で判定します。` };
      }

      if (r.inSitu.includes(t)) {
        return { stage: "上皮内", tone: "ok", reason: `${t}${n}${m} のため、上皮内として判定します。` };
      }

      if (r.localized.includes(t) && n === "N0" && m === "M0") {
        return { stage: "限局", tone: "ok", reason: `${t}${n}${m} のため、限局として判定します。` };
      }

      return { stage: "要確認", tone: "warn", reason: "現在のパイロットデータでは判定できない組み合わせです。原資料を確認してください。" };
    }

    function setDescription(site, t, n, m) {
      const ti = findItem(site.t, t);
      const ni = findItem(site.n, n);
      const mi = findItem(site.m, m);
      tDesc.textContent = ti ? ti.desc : "-";
      nDesc.textContent = ni ? ni.desc : "-";
      mDesc.textContent = mi ? mi.desc : "-";
    }

    function updateResult() {
      const site = getCurrentSite();
      if (!site) return;

      const t = tSelect.value;
      const n = nSelect.value;
      const m = mSelect.value;
      const result = judge(site, t, n, m);

      setDescription(site, t, n, m);

      stageResult.textContent = result.stage;
      stageResult.className = `stage ${result.tone}`;
      logicResult.textContent = result.reason;

      selectedBadges.innerHTML = "";
      [categorySelect.value, siteSelect.value, t || "T未選択", n || "N未選択", m || "M未選択"].forEach(value => {
        const span = document.createElement("span");
        span.className = "badge";
        span.textContent = value;
        selectedBadges.appendChild(span);
      });
    }

    function renderRuleTable() {
      const site = getCurrentSite();
      if (!site) return;

      function descList(codes, sourceItems) {
        if (!codes.length) return "該当なし・未設定";
        return codes.map(code => {
          const item = findItem(sourceItems, code);
          return item ? `${item.code}：${item.desc}` : code;
        }).join("<br>");
      }

      const rows = [
        ["上皮内", descList(site.rules.inSitu, site.t)],
        ["限局", descList(site.rules.localized, site.t)],
        ["隣接臓器浸潤", descList(site.rules.adjacent, site.t)],
        ["領域リンパ節転移", descList(site.rules.regionalNodes, site.n)],
        ["遠隔転移", descList(site.rules.distant, site.m)]
      ];

      ruleTable.innerHTML = `
        <table>
          <thead><tr><th>進展度</th><th>該当するT/N/Mと説明</th></tr></thead>
          <tbody>
            ${rows.map(([label, vals]) => `<tr><td>${label}</td><td>${vals}</td></tr>`).join("")}
          </tbody>
        </table>
        <div class="small" style="margin-top: 8px;">
          ※ v0.4はパイロット版です。肺・乳房・前立腺などの詳細説明は今後原資料照合で拡充します。
        </div>
      `;
    }

    function normalizeQuickText(text) {
      return text
        .toUpperCase()
        .replace(/[ＰＣＹ]/g, "")
        .replace(/\s+/g, "");
    }

    function applyQuickInput() {
      const site = getCurrentSite();
      if (!site) return;

      const s = normalizeQuickText(quickInput.value);
      if (!s) return;

      const allT = [...site.t].sort((a, b) => b.code.length - a.code.length);
      const allN = [...site.n].sort((a, b) => b.code.length - a.code.length);
      const allM = [...site.m].sort((a, b) => b.code.length - a.code.length);

      const foundT = allT.find(x => s.includes(x.code.toUpperCase()));
      const foundN = allN.find(x => s.includes(x.code.toUpperCase()));
      const foundM = allM.find(x => s.includes(x.code.toUpperCase()));

      if (foundT) tSelect.value = foundT.code;
      if (foundN) nSelect.value = foundN.code;
      if (foundM) mSelect.value = foundM.code;

      updateResult();
    }

    categorySelect.addEventListener("change", updateSites);
    siteSelect.addEventListener("change", updateTnmOptions);
    tSelect.addEventListener("change", updateResult);
    nSelect.addEventListener("change", updateResult);
    mSelect.addEventListener("change", updateResult);
    quickInput.addEventListener("input", applyQuickInput);

    initCategories();
  </script>
</body>
</html>
