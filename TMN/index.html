<!doctype html>

<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--soft:#dbeafe;--warn:#fff7ed;--warn-line:#fed7aa;--shadow:0 8px 24px rgba(15,23,42,.08);--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}header{padding:22px 16px 12px;text-align:center}h1{margin:0;font-size:1.45rem}.subtitle{margin-top:6px;color:var(--muted);font-size:.92rem}main{max-width:960px;margin:0 auto;padding:0 14px 30px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-weight:800;margin-bottom:6px;font-size:.92rem}input,select{width:100%;padding:12px 11px;border-radius:12px;border:1px solid #cbd5e1;background:#fff;color:var(--text);font-size:1rem}input:focus,select:focus{outline:2px solid var(--soft);border-color:var(--accent)}.site-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.site-button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer;color:#334155}.site-button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.selected-site{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:10px}.selected-site h2{margin:0;font-size:1.25rem}.category-badge{border-radius:999px;background:var(--soft);color:#1e40af;font-weight:800;padding:4px 10px;font-size:.82rem}.extent-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.extent-card{border:1px solid var(--line);border-radius:14px;background:#f9fafb;padding:12px;min-height:130px}.extent-title{font-weight:900;margin-bottom:6px;color:#111827}.code-list{display:flex;flex-wrap:wrap;gap:6px}.code{display:inline-flex;border-radius:999px;background:#fff;border:1px solid #cbd5e1;paddin <body>
<header><h1>TNM分類 進展度早見ツール v0.5</h1><div class="subtitle">部位検索 → 進展度一覧をメイン表示</div></header>
<main>
<section class="card"><label for="siteSearch">部位検索</label><input id="siteSearch" placeholder="例：胃 / GIST / 小腸 / 肺 / 乳房"><div id="siteList" class="site-list"></div></section>
<section class="card"><div class="selected-site"><span id="selectedCategory" class="category-badge">-</span><h2 id="selectedSiteName">-</h2></div><div class="extent-grid" id="extentGrid"></div><details open><summary>T/N/M定義コメント一覧</summary><div id="descTable" class="desc-table-wrap"></div></details><div class="note">まず部位を検索して、進展度一覧を確認する用途を優先したパイロット版です。診断・治療方針決定には使用せず、原資料と診療録で確認してください。</div></section>
<section class="card"><details><summary>T/N/Mを選んで進展度を判定する</summary><div class="grid3" style="margin-top:14px"><div><label for="tSelect">T分類</label><select id="tSelect"></select><div class="hint"><div class="hint-title">Tの説明</div><div id="tDesc">-</div></div></div><div><label for="nSelect">N分類</label><select id="nSelect"></select><div class="hint"><div class="hint-title">Nの説明</div><div id="nDesc">-</div></div></div><div><label for="mSelect">M分類</label><select id="mSelect"></select><div class="hint"><div class="hint-title">Mの説明</div><div id="mDesc">-</div></div></div></div><div class="result-box"><div class="result-title">判定結果</div><div id="stageResult" class="stage neutral">-</div><div id="logicResult" class="logic"></div></div><div style="margin-top:12px"><label for="quickInput">TNMまとめ入力（試験機能）</label><input id="quickInput" placeholder="例：T3N1M0 / T4a N0 M0 / pT2 pN0 cM0"><div class="small" style="margin-top:6px">入力すると、T/N/Mのプルダウンへ自動反映します。</div></div></details></section>
<div class="footer">出典：国立がん研究センター がん情報サービス「進展度，UICC TNM分類対応表（72部位，UICC第8版準拠）」をもとに作成中</div>
</main>

function c(code,desc){return{code,desc}}
const $=id=>document.getElementById(id);let currentSite=DATA[0];
function item(items,code){return items.find(x=>x.code===code)}
function match(row,q){if(!q)return true;return [row.category,row.site,...(row.keywords||[])].join(" ").toLowerCase().includes(q.toLowerCase())}
function renderSiteList(){const q=$("siteSearch").value.trim();const list=DATA.filter(r=>match(r,q));$("siteList").innerHTML="";list.forEach(r=>{const b=document.createElement("button");b.type="button";b.className="site-button"+(r.site===currentSite.site?" active":"");b.textContent=r.site;b.onclick=()=>{currentSite=r;renderAll()};$("siteList").appendChild(b)});if(!list.length){$("siteList").innerHTML='<span class="small">該当する部位がありません。</span>'}}
function badges(codes){return codes&&codes.length?'<div class="code-list">'+codes.map(x=>`<span class="code">${x}</span>`).join("")+'</div>':'<span class="small">該当なし・未設定</span>'}
function renderExtent(){const r=currentSite.rules;const rows=[["上皮内",r.inSitu],["限局",r.localized],["隣接臓器浸潤",r.adjacent],["領域リンパ節転移",r.regionalNodes],["遠隔転移",r.distant]];$("extentGrid").innerHTML=rows.map(([a,b])=>`<div class="extent-card"><div class="extent-title">${a}</div>${badges(b)}</div>`).join("")}
function descRows(k,items){return items.map(x=>`<tr><td>${k}</td><td><strong>${x.code}</strong></td><td>${x.desc||""}</td></tr>`).join("")}
function renderDesc(){ $("descTable").innerHTML=`<table><thead><tr><th>分類</th><th>コード</th><th>コメント</th></tr></thead><tbody>${descRows("T",currentSite.t)}${descRows("N",currentSite.n)}${descRows("M",currentSite.m)}</tbody></table>`}
function optionLabel(x){return x.desc?`${x.code}（${x.desc}）`:x.code}
function options(sel,items,empty=false){sel.innerHTML="";if(empty)sel.add(new Option("選択してください",""));items.forEach(x=>sel.add(new Option(optionLabel(x),x.code)))}
function unknown(v){return !v||v==="Tx"||v==="Nx"||v==="Mx"}
function judge(site,t,n,m){const r=site.rules;if(r.distant.includes(m))return{stage:"遠隔転移",tone:"danger",reason:`${m} が選択されているため、遠隔転移を優先して判定します。`};if(unknown(t)||unknown(n)||unknown(m))return{stage:"判定保留",tone:"warn",reason:"Tx / Nx / Mx / 未選択が含まれるため、進展度は確定できません。"};if(r.regionalNodes.includes(n))return{stage:"領域リンパ節転移",tone:"ok",reason:`${n} が領域リンパ節転移群に含まれるため、N分類を優先して判定します。`};if(r.adjacent.includes(t))return{stage:"隣接臓器浸潤",tone:"ok",reason:`${t} が隣接臓器浸潤群に含まれ、${n}${m} のため、T分類で判定します。`};if(r.inSitu.includes(t))return{stage:"上皮内",tone:"ok",reason:`${t}${n}${m} のため、上皮内として判定します。`};if(r.localized.includes(t)&&n==="N0"&&m==="M0")return{stage:"限局",tone:"ok",reason:`${t}${n}${m} のため、限局として判定します。`};return{stage:"要確認",tone:"warn",reason:"現在のパイロットデータでは判定できない組み合わせです。原資料を確認してください。"}}
function updateTnm(){options($("tSelect"),currentSite.t,true);options($("nSelect"),currentSite.n,true);options($("mSelect"),currentSite.m,true);const dt=currentSite.t.find(x=>x.code==="T1")||currentSite.t.find(x=>x.code==="T1a")||currentSite.t[0];if(dt)$("tSelect").value=dt.code;if(currentSite.n.some(x=>x.code==="N0"))$("nSelect").value="N0";if(currentSite.m.some(x=>x.code==="M0"))$("mSelect").value="M0";updateResult()}
function updateResult(){const t=$("tSelect").value,n=$("nSelect").value,m=$("mSelect").value;$("tDesc").textContent=(item(currentSite.t,t)||{}).desc||"-";$("nDesc").textContent=(item(currentSite.n,n)||{}).desc||"-";$("mDesc").textContent=(item(currentSite.m,m)||{}).desc||"-";const res=judge(currentSite,t,n,m);$("stageResult").textContent=res.stage;$("stageResult").className=`stage ${res.tone}`;$("logicResult").textContent=res.reason}
function norm(s){return s.toUpperCase().replace(/[ＰＣＹ]/g,"").replace(/\s+/g,"")}
function quick(){const s=norm($("quickInput").value);if(!s)return;[[currentSite.t,$("tSelect")],[currentSite.n,$("nSelect")],[currentSite.m,$("mSelect")]].forEach(([arr,sel])=>{const f=[...arr].sort((a,b)=>b.code.length-a.code.length).find(x=>s.includes(x.code.toUpperCase()));if(f)sel.value=f.code});updateResult()}
function renderAll(){ $("selectedCategory").textContent=currentSite.category;$("selectedSiteName").textContent=currentSite.site;renderSiteList();renderExtent();renderDesc();updateTnm()}
$("siteSearch").addEventListener("input",renderSiteList);$("tSelect").addEventListener("change",updateResult);$("nSelect").addEventListener("change",updateResult);$("mSelect").addEventListener("change",updateResult);$("quickInput").addEventListener("input",quick);renderAll();
</script>
