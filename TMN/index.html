<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TNM分類早見ツール v0.1</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --accent: #1d4ed8;
      --accent-soft: #e8f0ff;
      --danger: #b42318;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      padding: 24px 16px 12px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.45rem, 4vw, 2.1rem);
      line-height: 1.25;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      width: min(960px, calc(100% - 24px));
      margin: 0 auto 36px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    select, input {
      width: 100%;
      padding: 12px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font-size: 1rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .result {
      min-height: 96px;
      border-radius: 14px;
      background: var(--accent-soft);
      padding: 14px;
      margin-top: 14px;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #b9c8ee;
      padding: 7px 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .note {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 8px 0 0;
    }

    .warning {
      border-left: 4px solid var(--danger);
      padding-left: 10px;
    }

    details summary {
      cursor: pointer;
      font-weight: 800;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.92rem;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 8px;
      vertical-align: top;
    }

    th {
      background: #f2f4f8;
      text-align: left;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>TNM分類早見ツール v0.1</h1>
    <p class="subtitle">進展度 ↔ TNM分類の簡易検索。パイロット版：胃・大腸・肺・乳房・前立腺</p>
  </header>

  <main>
    <section class="card warning">
      <strong>注意：</strong>このツールは院内確認・登録補助用の早見表です。診断・治療方針決定には使わず、必ず原典・院内ルールを確認してください。<br>
      出典：国立がん研究センター がん情報サービス「進展度，UICC TNM分類対応表（72部位，UICC第8版準拠）」2022年7月25日更新
    </section>

    <section class="card">
      <div class="tabs" aria-label="検索モード">
        <button type="button" id="modeExtent" class="active">進展度から探す</button>
        <button type="button" id="modeTnm">TNMから逆引き</button>
      </div>

      <div class="grid">
        <div>
          <label for="siteSelect">部位</label>
          <select id="siteSelect"></select>
        </div>

        <div id="extentBox">
          <label for="extentSelect">進展度</label>
          <select id="extentSelect"></select>
        </div>

        <div id="tnmBox" class="hidden">
          <label for="tnmSearch">TNMを入力</label>
          <input id="tnmSearch" type="search" placeholder="例：T4, N1, M1, T1a" autocomplete="off" />
          <p class="note">範囲表記も拾います。例：N2 は N1-N3 に該当。</p>
        </div>
      </div>

      <div class="result" id="resultArea" aria-live="polite"></div>
    </section>

    <section class="card">
      <details>
        <summary>登録済みデータを見る</summary>
        <div id="dataTable"></div>
      </details>
    </section>
  </main>

  <script>
    // パイロット版データ。正式運用時は data/tnm-data.json に分離してもよい。
    const TNM_DATA = [
      {
        site: "胃",
        sourceMemo: "PDF (14) 胃",
        rows: [
          { extent: "限局", tnm: ["T1a", "T1b", "T2", "T3"], detail: "T1a(M), T1b(SM), T2(MP), T3(SS)" },
          { extent: "領域リンパ節転移", tnm: ["N1-N3"], detail: "取扱い規約：n1-n3" },
          { extent: "隣接臓器浸潤", tnm: ["T4a", "T4b"], detail: "T4a(SE), T4b(SI)" },
          { extent: "遠隔転移", tnm: ["M1"], detail: "P1, CY1, H1, M1" }
        ]
      },
      {
        site: "大腸（結腸・直腸）",
        sourceMemo: "PDF (18) 結腸，直腸",
        rows: [
          { extent: "上皮内", tnm: ["Tis"], detail: "Tis(M)" },
          { extent: "限局", tnm: ["T1", "T2", "T3"], detail: "T1(SM), T2(MP), T3(SS,A)" },
          { extent: "領域リンパ節転移", tnm: ["N1-N2"], detail: "取扱い規約：n1-n3。n3は主リンパ節/側方リンパ節への転移" },
          { extent: "隣接臓器浸潤", tnm: ["T4a", "T4b"], detail: "T4a(SE), T4b(SI,AI)" },
          { extent: "遠隔転移", tnm: ["M1a-M1c"], detail: "取扱い規約：M1a-M1b" }
        ]
      },
      {
        site: "肺（主気管支・気管支・肺）",
        sourceMemo: "PDF (33) 主気管支・気管支・肺",
        rows: [
          { extent: "上皮内", tnm: ["Tis"], detail: "上皮内" },
          { extent: "限局", tnm: ["T1mi", "T1a", "T1b", "T1c", "T2a", "T2b"], detail: "T1mi〜T2b" },
          { extent: "領域リンパ節転移", tnm: ["N1-N2"], detail: "N1-N2" },
          { extent: "隣接臓器浸潤", tnm: ["T3", "T4"], detail: "T3/T4" },
          { extent: "遠隔転移", tnm: ["N3", "M1a-M1c"], detail: "N3, M1a-M1c" }
        ]
      },
      {
        site: "乳房",
        sourceMemo: "PDF (47) 乳房",
        rows: [
          { extent: "上皮内", tnm: ["Tis"], detail: "非浸潤または腫瘍を認めないPaget病" },
          { extent: "限局", tnm: ["T1mi-T1c", "T2", "T3"], detail: "T1mi-T1c, T2, T3" },
          { extent: "領域リンパ節転移", tnm: ["N1-N3b"], detail: "N1-N3b" },
          { extent: "隣接臓器浸潤", tnm: ["T4a-T4d"], detail: "胸壁/皮膚に直接進展，炎症性乳癌" },
          { extent: "遠隔転移", tnm: ["N3c", "M1"], detail: "N3c, M1" }
        ]
      },
      {
        site: "前立腺",
        sourceMemo: "PDF (56) 前立腺",
        rows: [
          { extent: "限局", tnm: ["T1a-T1c", "T2a-T2c"], detail: "T1a-T1c：触知不能・画像診断不能。T2a-T2c：前立腺に限局" },
          { extent: "領域リンパ節転移", tnm: ["N1"], detail: "N1" },
          { extent: "隣接臓器浸潤", tnm: ["T3a-T3b", "T4"], detail: "T3a-T3b：被膜を越えて浸潤。T4：精嚢以外の隣接構造に浸潤" },
          { extent: "遠隔転移", tnm: ["M1a-M1c"], detail: "M1a-M1c" }
        ]
      }
    ];

    const siteSelect = document.getElementById("siteSelect");
    const extentSelect = document.getElementById("extentSelect");
    const tnmSearch = document.getElementById("tnmSearch");
    const resultArea = document.getElementById("resultArea");
    const dataTable = document.getElementById("dataTable");
    const modeExtent = document.getElementById("modeExtent");
    const modeTnm = document.getElementById("modeTnm");
    const extentBox = document.getElementById("extentBox");
    const tnmBox = document.getElementById("tnmBox");

    let currentMode = "extent";

    function normalize(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[Ａ-Ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/－/g, "-");
    }

    function splitCode(code) {
      const normalized = normalize(code);
      const match = normalized.match(/^([A-Z]+)(\d+)([A-Z]*)$/);
      if (!match) return null;
      return { prefix: match[1], number: Number(match[2]), suffix: match[3] || "" };
    }

    function codeMatches(query, expression) {
      const q = normalize(query);
      const exp = normalize(expression);
      if (!q) return false;
      if (q === exp) return true;
      if (!exp.includes("-")) return false;

      const parts = exp.split("-");
      if (parts.length !== 2) return false;

      const start = splitCode(parts[0]);
      let end = splitCode(parts[1]);
      const target = splitCode(q);
      if (!start || !target) return false;

      // N1-N3 のように後半の接頭辞が省略されるケースを補完
      if (!end && /^[0-9]+[A-Z]*$/.test(parts[1])) {
        end = splitCode(start.prefix + parts[1]);
      }
      if (!end) return false;
      if (start.prefix !== target.prefix || end.prefix !== target.prefix) return false;

      return start.number <= target.number && target.number <= end.number;
    }

    function getCurrentSite() {
      return TNM_DATA.find(item => item.site === siteSelect.value) || TNM_DATA[0];
    }

    function fillSites() {
      siteSelect.innerHTML = TNM_DATA.map(item => `<option value="${item.site}">${item.site}</option>`).join("");
    }

    function fillExtents() {
      const site = getCurrentSite();
      extentSelect.innerHTML = site.rows.map(row => `<option value="${row.extent}">${row.extent}</option>`).join("");
    }

    function renderExtentResult() {
      const site = getCurrentSite();
      const row = site.rows.find(item => item.extent === extentSelect.value);
      if (!row) return;

      resultArea.innerHTML = `
        <h2>${site.site}：${row.extent}</h2>
        <div class="badges">${row.tnm.map(code => `<span class="badge">${code}</span>`).join("")}</div>
        <p class="note">${row.detail}</p>
      `;
    }

    function renderTnmResult() {
      const site = getCurrentSite();
      const query = normalize(tnmSearch.value);
      if (!query) {
        resultArea.innerHTML = `<h2>TNMを入力してな</h2><p class="note">例：T4、N1、M1、T1a</p>`;
        return;
      }

      const matches = site.rows.filter(row => row.tnm.some(code => codeMatches(query, code)));
      if (matches.length === 0) {
        resultArea.innerHTML = `<h2>該当なし</h2><p class="note">${site.site} で「${query}」に一致する登録データはありません。</p>`;
        return;
      }

      resultArea.innerHTML = matches.map(row => `
        <h2>${site.site}：${row.extent}</h2>
        <div class="badges">${row.tnm.map(code => `<span class="badge">${code}</span>`).join("")}</div>
        <p class="note">${row.detail}</p>
      `).join("<hr>");
    }

    function render() {
      if (currentMode === "extent") renderExtentResult();
      if (currentMode === "tnm") renderTnmResult();
    }

    function switchMode(mode) {
      currentMode = mode;
      modeExtent.classList.toggle("active", mode === "extent");
      modeTnm.classList.toggle("active", mode === "tnm");
      extentBox.classList.toggle("hidden", mode !== "extent");
      tnmBox.classList.toggle("hidden", mode !== "tnm");
      render();
    }

    function renderDataTable() {
      const rows = TNM_DATA.flatMap(site => site.rows.map(row => `
        <tr>
          <td>${site.site}</td>
          <td>${row.extent}</td>
          <td>${row.tnm.join(", ")}</td>
          <td>${row.detail}</td>
        </tr>
      `)).join("");

      dataTable.innerHTML = `
        <table>
          <thead>
            <tr><th>部位</th><th>進展度</th><th>TNM</th><th>メモ</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    siteSelect.addEventListener("change", () => {
      fillExtents();
      render();
    });
    extentSelect.addEventListener("change", render);
    tnmSearch.addEventListener("input", render);
    modeExtent.addEventListener("click", () => switchMode("extent"));
    modeTnm.addEventListener("click", () => switchMode("tnm"));

    fillSites();
    fillExtents();
    renderDataTable();
    render();
  </script>
</body>
</html>
